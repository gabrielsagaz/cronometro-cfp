<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E7A4B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cronômetro CFP">
</head>
<body>
<title>Cronômetro CFP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: lista de programas por bloco de semanas, ajustes por programa, e um cronômetro em tela cheia
   cuja cor muda a cada fase (verde trabalha, azul descansa, âmbar prepara) para ler de longe, ao sol. */
:root {
  --bg: #F1F3F0;
  --surface: #FFFFFF;
  --ink: #111619;
  --muted: #566065;
  --line: #D3D9D5;
  --chip: #E3E9E5;
  --go: #0E7A4B;
  --go-ink: #FFFFFF;
  --work: #0E7A4B;
  --rest: #2457C5;
  --prep: #9A5F08;
  --done: #38424A;
  --c-barra: #9A5F08; --c-corr: #2457C5; --c-cond: #0E7A4B;
  --display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1315; --surface: #171D20; --ink: #EAEEEB; --muted: #9AA5A9; --line: #2A3438; --chip: #222B2F;
    --go: #1DA56A; --go-ink: #04150D; --work: #0B6B42; --rest: #1F4BAE; --prep: #85500A; --done: #2B343A;
    --c-barra: #E0A23A; --c-corr: #7AA2FF; --c-cond: #2FBF83;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1315; --surface: #171D20; --ink: #EAEEEB; --muted: #9AA5A9; --line: #2A3438; --chip: #222B2F;
  --go: #1DA56A; --go-ink: #04150D; --work: #0B6B42; --rest: #1F4BAE; --prep: #85500A; --done: #2B343A;
  --c-barra: #E0A23A; --c-corr: #7AA2FF; --c-cond: #2FBF83;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.4;
  padding-block: 8px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--rest); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; min-width: 0; }
h1, h2, h3, p, ol, ul { margin: 0; }

/* Início */
.top { padding: 20px 0 8px; }
.top h1 { font-family: var(--display); font-weight: 700; font-size: 44px; line-height: 1; text-transform: uppercase; letter-spacing: .02em; text-wrap: balance; }
.top p { margin-top: 8px; color: var(--muted); max-width: 40ch; }
.group { margin-top: 24px; display: grid; gap: 10px; }
.group h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.group h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.card {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; text-align: left;
  width: 100%; min-height: 84px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
.card:active { border-color: var(--ink); }
.card .name { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.05; text-transform: uppercase; letter-spacing: .02em; }
.card .name small { display: block; font-family: var(--body); font-weight: 500; font-size: 15px; text-transform: none; letter-spacing: 0; color: var(--muted); margin-top: 2px; }
.card .meta { grid-column: 1 / -1; color: var(--muted); font-size: 15px; }
.chip { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; padding: 4px 8px; border-radius: 6px; background: var(--chip); white-space: nowrap; }
.chip.mode { background: var(--ink); color: var(--bg); }

/* Programa */
.back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 12px 0 0; background: none; border: 0; font-weight: 600; }
.back svg { width: 22px; height: 22px; }
.ptitle { margin-top: 4px; }
.ptitle h1 { font-family: var(--display); font-weight: 700; font-size: 40px; line-height: 1; text-transform: uppercase; letter-spacing: .02em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.panel { margin-top: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px 16px; }
.panel h2, .list h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.panel h2 { padding: 12px 0 2px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.panel h2 + .row { border-top: 0; }
.row .lbl { min-width: 0; }
.row .lbl b { display: block; font-weight: 600; }
.row .lbl span { display: block; font-size: 13px; color: var(--muted); }
.step { display: flex; align-items: center; gap: 6px; flex: none; }
.step button { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 24px; line-height: 1; font-weight: 600; }
.step button:disabled { opacity: .35; cursor: default; }
.step output { min-width: 66px; text-align: center; font-family: var(--display); font-weight: 700; font-size: 26px; }
.link { background: none; border: 0; padding: 12px 0; color: var(--muted); text-decoration: underline; font-size: 14px; }
.list { margin-top: 20px; }
.list ol { margin-top: 8px; padding: 0; list-style: none; counter-reset: ex; display: grid; gap: 0; }
.list li { counter-increment: ex; display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-weight: 500; }
.list li::before { content: counter(ex); flex: none; width: 24px; font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1.2; color: var(--muted); }
.sum { margin-top: 16px; color: var(--muted); font-size: 15px; }
.sum b { color: var(--ink); font-weight: 600; }
.hint { margin-top: 12px; font-size: 14px; color: var(--muted); }
.bar { position: sticky; bottom: 0; margin-top: 16px; padding: 24px 0 8px; background: linear-gradient(to bottom, transparent, var(--bg) 40%); }
.start { width: 100%; min-height: 64px; border: 0; border-radius: 12px; background: var(--go); color: var(--go-ink); font-family: var(--display); font-weight: 700; font-size: 30px; letter-spacing: .06em; text-transform: uppercase; }

/* Calendário */
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 12px; padding: 4px; background: var(--chip); border-radius: 12px; }
.tabs button { min-height: 44px; border: 0; border-radius: 9px; background: none; font-weight: 600; }
.tabs button[aria-current="page"] { background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
.cprog { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.cprog b { font-weight: 600; }
.cprog .meter { margin-top: 8px; height: 8px; border-radius: 4px; background: var(--chip); overflow: hidden; }
.cprog .meter i { display: block; height: 100%; background: var(--go); }
.cprog .late { margin-top: 6px; font-size: 14px; color: #B3261E; font-weight: 600; }
:root[data-theme="dark"] .cprog .late { color: #FF8A80; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cprog .late { color: #FF8A80; } }
.nextbtn { margin-top: 10px; width: 100%; text-align: left; min-height: 52px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.nextbtn small { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.nextbtn b { font-weight: 600; }
.chead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 16px; }
.chead h2 { flex: 1; text-align: center; white-space: nowrap; font-family: var(--display); font-weight: 700; font-size: 28px; text-transform: uppercase; letter-spacing: .02em; }
.chead button { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 22px; line-height: 1; font-weight: 600; }
.chead button:disabled { opacity: .35; cursor: default; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 8px; }
.dow { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); text-align: center; padding: 2px 0; }
.day { position: relative; min-height: 58px; min-width: 0; padding: 6px 0 5px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; align-items: center; gap: 5px; }
.day.out { border: 0; background: none; }
.day.none { background: transparent; color: var(--muted); }
.day.full { background: var(--chip); }
.day.sel { border-color: var(--rest); box-shadow: 0 0 0 2px var(--rest); }
.day .n { font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1; min-width: 26px; padding: 3px 4px 2px; border-radius: 999px; text-align: center; }
.day.today .n { background: var(--ink); color: var(--bg); }
.dots { display: flex; gap: 3px; justify-content: center; min-height: 10px; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--c); }
.dot.on { background: var(--c); }
.dot.barra { --c: var(--c-barra); } .dot.corrida { --c: var(--c-corr); } .dot.cond { --c: var(--c-cond); }
.day.full::after { content: "✓"; position: absolute; top: 2px; right: 4px; font-size: 11px; font-weight: 800; color: var(--go); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.dp { margin-top: 18px; scroll-margin-top: 8px; }
.dp h3 { font-family: var(--display); font-weight: 700; font-size: 26px; text-transform: uppercase; letter-spacing: .03em; }
.dp .sub { font-size: 14px; color: var(--muted); }
.sess { margin-top: 10px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--c); border-radius: 10px; display: grid; gap: 8px; }
.sess.barra { --c: var(--c-barra); } .sess.corrida { --c: var(--c-corr); } .sess.cond { --c: var(--c-cond); }
.sess .kind { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--c); }
.sess h4 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.1; text-transform: uppercase; letter-spacing: .02em; }
.sess p { margin: 0; font-size: 15px; color: var(--muted); }
.sess .btns { display: grid; gap: 8px; }
.exl { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.exl li { display: flex; align-items: center; gap: 10px; }
.exl .ths { display: flex; gap: 4px; flex: none; }
.exl .th { width: 60px; height: 60px; background: #EEF4F7; border-radius: 10px; padding: 3px; }
.exl .th svg { display: block; width: 100%; height: 100%; }
.exl .tx { font-size: 15px; font-weight: 600; line-height: 1.3; color: var(--ink); }
.exl .tx small { display: block; margin-top: 2px; font-size: 13px; font-weight: 400; line-height: 1.3; color: var(--muted); }
.exl .tx small.rs { margin-top: 1px; font-size: 14px; font-weight: 500; color: var(--ink); opacity: .75; }
.target { font-family: var(--display); font-weight: 700; font-size: clamp(24px, 7.5vw, 38px); line-height: 1.05; background: rgba(255,255,255,.2); border-radius: 12px; padding: 4px 14px; text-wrap: balance; }
.binfo { font-size: 15px; opacity: .92; max-width: 34ch; text-wrap: balance; }
.figbig.mob { display: grid; place-items: center; font-size: 56px; }
.exl li.nofig { padding-left: 2px; }
.mark { min-height: 50px; width: 100%; border-radius: 10px; border: 2px solid var(--c); background: transparent; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
.mark .box { width: 24px; height: 24px; border-radius: 7px; border: 2.5px solid currentColor; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; line-height: 1; }
.mark.on { background: var(--c); color: #fff; border-color: var(--c); }
:root[data-theme="dark"] .mark.on { color: #0B1013; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mark.on { color: #0B1013; } }
.mark.on .box { background: #fff; color: var(--c); border-color: #fff; }
.openp { min-height: 44px; width: 100%; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-weight: 600; }
.rest { color: var(--muted); }

/* Cronômetro */
.timer {
  position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; gap: 10px;
  background: var(--ph); color: #fff; overflow: hidden;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.timer.work { --ph: var(--work); } .timer.rest { --ph: var(--rest); } .timer.prep { --ph: var(--prep); } .timer.done { --ph: var(--done); }
.timer > * { width: 100%; max-width: 560px; margin-inline: auto; min-width: 0; }
.thead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tbtn { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.14); color: #fff; font-weight: 600; font-size: 15px; }
.tbtn[aria-pressed="true"] { background: #fff; color: var(--ph); }
.tgroup { display: flex; gap: 8px; }
.pbar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.25); overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; background: #fff; }
.where { font-size: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; opacity: .92; text-align: center; min-height: 1.4em; }
.tmain { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 6px; text-align: center; overflow-y: auto; min-height: 0; }
.phase { font-family: var(--display); font-weight: 700; font-size: 30px; letter-spacing: .12em; text-transform: uppercase; }
.count { font-family: var(--display); font-weight: 700; line-height: .95; font-variant-numeric: tabular-nums; font-size: min(26vw, 150px); font-size: min(26vw, 16dvh, 150px); }
.pbar.ph { width: min(100%, 360px); }
.exname { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 9vw, 48px); line-height: 1; text-transform: uppercase; letter-spacing: .02em; text-wrap: balance; margin-top: 2px; }
.next { font-size: 18px; opacity: .92; }
.next b { font-weight: 600; }
.items { width: 100%; max-width: 420px; margin: 6px auto 0; padding: 0; list-style: none; display: grid; text-align: left; }
.items li { border-top: 1px solid rgba(255,255,255,.28); }
.items li:first-child { border-top: 0; }
.it { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-radius: 10px; color: #fff; padding: 5px 6px; min-height: 56px; font-size: 20px; font-weight: 600; }
.it .t { min-width: 0; flex: 1; }
.dica { display: block; font-size: 13px; font-weight: 500; line-height: 1.25; margin-top: 2px; opacity: .85; }
.it.now { background: #fff; color: var(--ph); }
.it.ok { opacity: .55; }
.howto { margin: 4px auto 8px; padding: 6px 14px; border-radius: 999px; background: #fff; color: var(--ph); font-size: 15px; font-weight: 700; text-align: center; }
.chk { flex: none; width: 34px; height: 34px; border-radius: 10px; border: 2.5px solid currentColor; display: inline-flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; line-height: 1; }
.chk.on { background: #fff; color: var(--ph); border-color: #fff; }
.it.ok .t { text-decoration: line-through; }
.it .tag { flex: none; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; padding: 3px 7px; border: 1px solid currentColor; border-radius: 6px; }
.it.plain { min-height: 46px; font-size: 17px; font-weight: 500; opacity: .92; }
.it.plain .figsm { width: 38px; height: 38px; }
.tip { font-size: 14px; opacity: .9; }
/* bonecos dos exercícios (SVG animado): painel claro para o azul aparecer em qualquer fase */
[data-fig] svg { display: block; width: 100%; height: 100%; }
.figbig { display: block; width: min(40vw, 19dvh, 170px); aspect-ratio: 1; background: #EEF4F7; border-radius: 16px; padding: 4px; flex: none; }
.figsm { display: block; width: 46px; height: 46px; flex: none; background: #EEF4F7; border-radius: 10px; padding: 2px; }
.list .figsm { width: 56px; height: 56px; }
.list .dica { color: var(--muted); }
.how { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--chip); font-size: 15px; line-height: 1.45; }
.nextrow { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; opacity: .95; }
.rounds { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 8px; width: 100%; }
.rounds .plus { flex: 1; max-width: 320px; min-height: 64px; border-radius: 12px; border: 2px solid #fff; background: rgba(255,255,255,.14); color: #fff; font-family: var(--display); font-weight: 700; font-size: 28px; letter-spacing: .05em; text-transform: uppercase; }
.rounds .minus { width: 52px; min-height: 64px; border-radius: 12px; border: 1px solid rgba(255,255,255,.4); background: transparent; color: #fff; font-size: 26px; }
.rounds .n { min-width: 60px; text-align: center; font-family: var(--display); font-weight: 700; font-size: 40px; }
.controls { display: grid; grid-template-columns: 1fr 1.6fr 1fr; gap: 10px; align-items: stretch; }
.cbtn { min-height: 72px; border-radius: 14px; border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.14); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 14px; font-weight: 600; }
.cbtn svg { width: 26px; height: 26px; fill: currentColor; }
.cbtn.main { background: #fff; color: var(--ph); border-color: #fff; font-size: 16px; }
.cbtn.main svg { width: 30px; height: 30px; }
.sheet { position: absolute; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; padding: 16px; }
.sheet > div { width: 100%; max-width: 420px; background: var(--surface); color: var(--ink); border-radius: 14px; padding: 18px; display: grid; gap: 12px; margin-bottom: env(safe-area-inset-bottom, 0px); }
.sheet h3 { font-family: var(--display); font-weight: 700; font-size: 26px; text-transform: uppercase; letter-spacing: .03em; }
.sheet .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sheet button { min-height: 52px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-weight: 600; }
.sheet button.danger { background: #B3261E; border-color: #B3261E; color: #fff; }
.donebox { display: grid; gap: 8px; text-align: center; }
.donebox .big { font-family: var(--display); font-weight: 700; font-size: clamp(44px, 14vw, 72px); line-height: 1; text-transform: uppercase; letter-spacing: .03em; }
.donebox p { font-size: 18px; }
.donebox .stat { font-family: var(--display); font-weight: 700; font-size: 44px; line-height: 1; margin-top: 10px; font-variant-numeric: tabular-nums; }
.donebox .cap { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; opacity: .85; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) { .pbar i { transition: width .25s linear; } }
</style>

<div id="app"></div>
<div id="live" class="vh" aria-live="polite"></div>

<script>
/* Bonecos animados: cada exercício é uma lista de poses (keyframes) que se interpolam em loop.
   Ordem dos pontos em cada pose: cabeça, pescoço, quadril, cotovelo/mão do lado de trás (L),
   cotovelo/mão do lado da frente (R), joelho/pé L, joelho/pé R. Tela 100x100, chão em y=93. */
var FIGS = (function () {
  function P(h, n, p, le, lh, re, rh, lk, lf, rk, rf) { return [].concat(h, n, p, le, lh, re, rh, lk, lf, rk, rf); }
  function Z(a, z) { a.z = z; return a; }
  function mir(a) { return a.map(function (v, i) { return i % 2 === 0 ? 100 - v : v; }); }

  /* ---------- Cronômetro ---------- */

  }

  function phaseLabel(ph) {
    if (ph.kind === 'prep') return 'Prepare-se';
    if (ph.kind === 'work') return 'Trabalho';
    if (ph.kind === 'rest') return 'Descanso';
    return 'Descanso entre ' + (T.p.kind === 'circuit' ? 'séries' : 'voltas');
  }

  function advance() {
    if (T.i >= T.phases.length - 1) { finish(); return false; }
    T.i++;
    T.end += T.phases[T.i].dur * 1000;
    onPhaseStart();
    renderTimer();
    return true;
  }

  function tick() {
    if (!T || T.done) return;
    var now = performance.now();
    if (T.running) {
      T.runMs += now - T.last; T.last = now;
      var guard = 0;
      while (T.end - now <= 0 && guard++ < 200) { if (!advance()) return; }
    } else { T.last = now; }
    updateDigits(now);
  }

  function updateDigits(now) {
    var ph = T.phases[T.i], left = leftMs(now);
    var cd = document.getElementById('cd'); if (!cd) return;
    cd.textContent = fmtClock(left / 1000);
    var sec = Math.ceil(left / 1000);
    if (T.running && sec >= 1 && sec <= 3 && ph.dur >= 5 && sec !== T.lastBeep) { T.lastBeep = sec; beep(880, 0.12); buzz([40]); }
    var pp = document.getElementById('pbPhase'), pt = document.getElementById('pbTotal');
    if (pp) pp.style.width = Math.min(100, Math.max(0, (1 - left / (ph.dur * 1000)) * 100)) + '%';
    if (pt) pt.style.width = Math.min(100, Math.max(0, (T.cum[T.i] + ph.dur - left / 1000) / T.total * 100)) + '%';
  }

  function goTo(idx) {
    idx = Math.max(0, idx);
    if (idx >= T.phases.length) { finish(); return; }
    var now = performance.now();
    T.i = idx;
    var d = T.phases[idx].dur * 1000;

    renderTimer();
    updateDigits(now);
  }

  function togglePause() {

    renderTimer();
    updateDigits(now);
  }

  function finish() {
    T.done = true; T.running = false;
    clearInterval(timerId); timerId = null;
    unlockScreen();
    beep(784, 0.18); beep(988, 0.18, 0.22); beep(1318, 0.45, 0.44); buzz([300, 100, 300]);
    speak('Treino concluído');

    var tdIso = isoOf(new Date()), hit = null, mine = PLAN.filter(function (it) { return it.pr === T.p.id; });

    else if (act === 'reset') { delete store.cfg[curId]; save(); var y2 = window.scrollY; renderProg(); window.scrollTo(0, y2); }
    else if (act === 'start') startTimer();
    else if (act === 'again') { startTimer(); }
    else if (act === 'pause') togglePause();
    else if (act === 'next') goTo(T.i + 1);
    else if (act === 'prev') {
      var left = (T.phases[T.i].dur * 1000) - leftMs(performance.now());
      goTo(left > 3000 ? T.i : T.i - 1);
    }
    else if (act === 'sound') { store.prefs.sound = !store.prefs.sound; save(); b.setAttribute('aria-pressed', store.prefs.sound); if (store.prefs.sound) beep(880, 0.1); }
    else if (act === 'voice') { store.prefs.voice = !store.prefs.voice; save(); b.setAttribute('aria-pressed', store.prefs.voice); if (!store.prefs.voice) { try { window.speechSynthesis.cancel(); } catch (er) {} } }
    else if (act === 'rplus') { roundDone(); }
    else if (act === 'item') { var ii = Number(b.getAttribute('data-i')), nn = T.p.items.length;
      if (T.p.kind === 'emom') { T.chk = T.chk || {}; T.chk[ii] = !T.chk[ii]; beep(900, 0.05); renderTimer(); return; }
      T.cur = ii < T.cur ? ii : ii + 1; beep(900, 0.05); if (T.p.kind === 'amrap' && T.cur >= nn) roundDone(); else renderTimer(); }
    else if (act === 'rminus') { var ph2 = T.phases[T.i]; T.rounds[ph2.rep - 1] = Math.max(0, T.rounds[ph2.rep - 1] - 1); renderTimer(); }
    else if (act === 'quit') { confirmQuit = true; renderTimer(); }
    else if (act === 'keep') { confirmQuit = false; renderTimer(); }
    else if (act === 'end') { stopTimer(); view = 'prog'; renderProg(); }
  });

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && T && !T.done) { if (T.running) { lockScreen(); tick(); } }
    if (document.visibilityState === 'visible' && BT && !BT.done && BT.running) { lockScreen(); btick(); }
  });

  window.__cfp = { PROGRAMS: PROGRAMS, buildPhases: buildPhases, totalSec: totalSec, getT: function () { return T; }, getBT: function () { return BT; }, BAR_EX: BAR_EX, bPhases: bPhases };
  try { FigEngine.start(); } catch (e) {}
  view = 'cal'; renderCal();
})();
